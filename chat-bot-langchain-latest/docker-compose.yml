services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:5003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}

    depends_on:
      - chroma